# Déploiement de production sur https://inventaire.browse.ma (Cloudflare Workers + Supabase).
#
# Secrets GitHub (Settings › Secrets and variables › Actions) :
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare, modèle « Edit Cloudflare Workers », limité au compte et à la zone browse.ma
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
#   DATABASE_URL           Supabase, pooler en mode transaction (port 6543) — utilisé par l'application
#   DATABASE_URL_DIRECTE   Supabase, connexion directe ou pooler en mode session (port 5432) — migrations et sauvegardes
#   SESSION_SECRET         32 caractères aléatoires minimum
#   DIRECTION_PIN          code PIN (6 chiffres) du compte Direction créé au premier déploiement
#   LOYVERSE_TOKEN         jeton d'accès Loyverse (facultatif tant qu'il n'est pas obtenu)
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-production
  cancel-in-progress: false

permissions:
  contents: read

# Le jeton Cloudflare n'est donné qu'aux étapes qui en ont besoin (pas à npm ci ni aux tests,
# qui exécutent du code de dépendances).
jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://inventaire.browse.ma
    steps:
      - name: Vérifier la configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECTE: ${{ secrets.DATABASE_URL_DIRECTE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DIRECTION_PIN: ${{ secrets.DIRECTION_PIN }}
        run: |
          manquants=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL DATABASE_URL_DIRECTE SESSION_SECRET DIRECTION_PIN; do
            [ -n "${!v}" ] || manquants="$manquants $v"
          done
          if [ -n "$manquants" ]; then
            echo "::error::Secrets GitHub manquants :$manquants (voir README, section Mise en production)"
            exit 1
          fi

      - name: Vérifier l'accès Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          r=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          if [ "$(echo "$r" | jq -r '.success')" != "true" ]; then
            echo "Réponse Cloudflare : $(echo "$r" | jq -c '.errors')"
            comptes=$(api "/accounts" | jq -r '[.result[]? | "\(.name) (\(.id))"] | join(", ")')
            echo "::error::Le jeton n'a pas accès aux Workers du compte indiqué dans CLOUDFLARE_ACCOUNT_ID. Vérifier que ce secret contient l'Account ID (et non le Zone ID de browse.ma) et que le jeton (modèle « Edit Cloudflare Workers ») inclut ce compte. Comptes visibles par le jeton : ${comptes:-aucun}"
            exit 1
          fi
          # Droit sur l'application elle-même (« Workers Scripts : Edit ») : « introuvable » (10007)
          # est normal avant le premier déploiement ; une erreur d'accès signale un droit manquant.
          w=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/inventaire-browse/settings")
          if [ "$(echo "$w" | jq -r '.success')" != "true" ] && ! echo "$w" | jq -e '.errors[]? | select(.code == 10007)' > /dev/null; then
            echo "Réponse Cloudflare : $(echo "$w" | jq -c '.errors')"
            echo "::error::Le jeton ne peut pas gérer l'application inventaire-browse : dans la politique du compte, ajouter « Workers Scripts » en mode Edit."
            exit 1
          fi
          z=$(api "/zones?name=browse.ma")
          if [ "$(echo "$z" | jq -r '.result | length')" = "0" ] || [ "$(echo "$z" | jq -r '.success')" != "true" ]; then
            echo "::error::Le jeton n'a pas accès à la zone browse.ma : dans le jeton, ajouter la zone browse.ma (Zone Resources)."
            exit 1
          fi
          echo "Accès Cloudflare vérifié : compte et zone browse.ma."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Migrations de la base
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECTE }}

      - name: Données initiales (sans effet si déjà présentes)
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECTE }}
          DIRECTION_PIN: ${{ secrets.DIRECTION_PIN }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}

      - name: Construire
        run: npx opennextjs-cloudflare build

      # Publier d'abord : au premier déploiement, le Worker doit exister avant de recevoir ses secrets.
      # Les secrets déjà enregistrés sont conservés d'un déploiement à l'autre.
      - name: Déployer sur inventaire.browse.ma
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: Envoyer les secrets de l'application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          LOYVERSE_TOKEN: ${{ secrets.LOYVERSE_TOKEN }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
        run: |
          # Les valeurs vides sont ignorées (ex. LOYVERSE_TOKEN pas encore disponible).
          jq -n 'env | {DATABASE_URL, SESSION_SECRET, LOYVERSE_TOKEN, PIN_PEPPER} | with_entries(select(.value != null and .value != ""))' \
            > secrets.json
          npx wrangler secret bulk secrets.json
          rm secrets.json

      - name: Vérifier que le site répond
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://inventaire.browse.ma/login || true)
            echo "Tentative $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Le site ne répond pas encore (propagation DNS / certificat possible au premier déploiement)."
